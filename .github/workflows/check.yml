name: ProfitPilot checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node build.cjs
      - run: npm ci
      - run: npm test
      - run: npm install --no-save --ignore-scripts @electric-sql/pglite@0.5.11
      - run: node check-db.cjs
      - run: npx playwright install --with-deps chrome webkit
      - run: npm run test:ui:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profitpilot-v5-browser-evidence
          path: test-results/
