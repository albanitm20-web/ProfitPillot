name: ProfitPilot checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node build.cjs
      - run: npm test
      - run: npm install --no-save --ignore-scripts @electric-sql/pglite@0.5.11
      - run: node check-db.cjs
